# flight price pipeline - everything runs locally in docker (Airflow 3)
#   airflow-db             postgres that Airflow uses for itself
#   mysql-staging          MySQL staging db (raw, validated, enriched and KPI tables)
#   postgres-analytics     Postgres analytics db (final tables, this is what the KPIs are read from)
#   airflow-apiserver      the web UI (http://localhost:8080) + API
#   airflow-scheduler      starts the tasks (LocalExecutor)
#   airflow-dag-processor  reads the DAG files from ./dags (in Airflow 3 this is its own service)

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.3-python3.11
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    # login with admin/admin (the user is created by airflow-init)
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # in Airflow 3 the tasks talk to the api server, all services need the same secrets for that
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-flight-price-pipeline-local-jwt-secret}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-flight-price-pipeline-local-api-secret}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # db connections as env vars, so I don't have to add them in the UI
    AIRFLOW_CONN_MYSQL_STAGING: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-staging:3306/${MYSQL_DATABASE}
    AIRFLOW_CONN_POSTGRES_ANALYTICS: postgres://${ANALYTICS_PG_USER}:${ANALYTICS_PG_PASSWORD}@postgres-analytics:5432/${ANALYTICS_PG_DB}
    FLIGHT_CSV_PATH: /opt/airflow/data/Flight_Price_Dataset_of_Bangladesh.csv
    # ---- email alerts (gmail) ----
    # the app password is NOT here, it's in .env (SMTP_PASSWORD)
    SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    SMTP_USER: ${SMTP_USER:-umutonijustine1@gmail.com}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-umutonijustine1@gmail.com}
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-umutonijustine1@gmail.com}
    # alert limits, timeouts and retries come from .env (env_file above)
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy
    mysql-staging:
      condition: service_healthy
    postgres-analytics:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    restart: unless-stopped
    volumes:
      - airflow3-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  mysql-staging:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20

  postgres-analytics:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ANALYTICS_PG_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_PG_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_PG_DB}
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${ANALYTICS_PG_USER}", "-d", "${ANALYTICS_PG_DB}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username "$${_AIRFLOW_WWW_USER_USERNAME:-admin}" --password "$${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true)
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow3-db-data:
  mysql-data:
  analytics-data:
